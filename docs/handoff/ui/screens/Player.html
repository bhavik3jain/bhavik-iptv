<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Player</title>
<link rel="stylesheet" href="../fonts/fonts.css">

<style>
body{margin:0;background:#000000}
a{color:#F5B841}a:hover{color:#FFD27A}
</style>

</head>
<body>

<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #1C3A2B; color: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif">

  <svg width="844" height="390" viewBox="0 0 844 390" aria-hidden="true" style="position: absolute; left: 0; top: 0"><rect width="844" height="96" fill="#132419"></rect><ellipse cx="422" cy="300" rx="430" ry="190" fill="#2A5A3E"></ellipse><rect x="392" y="170" width="60" height="190" rx="4" fill="#8C7A55"></rect><rect x="404" y="186" width="36" height="3" fill="#E9E2CF"></rect><rect x="404" y="340" width="36" height="3" fill="#E9E2CF"></rect><circle cx="422" cy="250" r="7" fill="#F2F1EE"></circle></svg>

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 130px; background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 100%)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%)"></div>

  <div style="position: absolute; top: 18px; left: 24px; right: 24px; display: flex; align-items: center; gap: 14px">
    <a href="LiveGuide.html" aria-label="Close player" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
    </a>
    <span style="width: 40px; height: 40px; border-radius: 10px; background: #2E6B4F; font: 700 13px Sora, sans-serif; display: flex; align-items: center; justify-content: center; flex: none">FS</span>
    <div style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
      <span style="font-family: Sora, sans-serif; font-weight: 600; font-size: 17px">Premier Cricket · Final, 2nd innings</span>
      <span style="font-size: 13px; color: #D0D3DA">102 Fieldhouse Sports · 19:30–22:30</span>
    </div>
    <div style="display: flex; gap: 6px">
      <button type="button" aria-label="Audio and subtitles" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"></rect><path d="M7 12.5h4M13 12.5h4M7 15h7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path></svg>
      </button>
      <button type="button" aria-label="Multi-view" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"></rect><rect x="13" y="4" width="8" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"></rect><rect x="3" y="13" width="8" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"></rect><rect x="13" y="13" width="8" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"></rect></svg>
      </button>
      <button type="button" aria-label="Picture in picture" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"></rect><rect x="12" y="11.5" width="7" height="5.5" rx="1" fill="#FFFFFF"></rect></svg>
      </button>
      <button type="button" aria-label="AirPlay" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17H4.5A1.5 1.5 0 0 1 3 15.5v-10A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v10a1.5 1.5 0 0 1-1.5 1.5H18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path><path d="M12 14l5 6H7z" fill="#FFFFFF"></path></svg>
      </button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; align-items: center; gap: 56px">
    <button type="button" aria-label="Back 10 seconds" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M7 15a8.5 8.5 0 1 0 2.6-6.1" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path><path d="M6.5 5v4.8h4.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="15.5" y="19" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF">10</text></svg>
    </button>
    <button type="button" aria-label="Pause" style="width: 72px; height: 72px; border-radius: 36px; border: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="8" y="6" width="5" height="18" rx="1.5" fill="#FFFFFF"></rect><rect x="17" y="6" width="5" height="18" rx="1.5" fill="#FFFFFF"></rect></svg>
    </button>
    <button type="button" aria-label="Forward 10 seconds" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M23 15a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path><path d="M23.5 5v4.8h-4.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="14.5" y="19" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF">10</text></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(255,255,255,0.16); font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: flex; align-items: center">−4:12</span>
      <span style="font-size: 13px; color: #D0D3DA">Paused live · catch-up from 19:30</span>
      <button type="button" style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #F5B841; color: #1A1408; font: 600 13px 'IBM Plex Sans', sans-serif; display: flex; align-items: center; gap: 6px">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #1A1408"></span>
        Jump to live
      </button>
    </div>
    <div style="position: relative; height: 16px; display: flex; align-items: center">
      <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22)"></div>
      <div style="position: absolute; left: 0; width: 40%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.45)"></div>
      <div style="position: absolute; left: 0; width: 37.7%; height: 4px; border-radius: 2px; background: #F5B841"></div>
      <div style="position: absolute; left: calc(37.7% - 8px); width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #D0D3DA">19:30</span>
      <span style="flex: 1"></span>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: rgba(255,255,255,0.14); color: #FFFFFF; font: 500 13px 'IBM Plex Sans', sans-serif">‹ 101 Cityline News</button>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: rgba(255,255,255,0.14); color: #FFFFFF; font: 500 13px 'IBM Plex Sans', sans-serif">103 Lantern Drama ›</button>
      <span style="flex: 1"></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #D0D3DA">22:30</span>
    </div>
  </div>
</div>


</body></html>
